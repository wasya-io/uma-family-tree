name = "uma-family-tree"
compatibility_date = "2024-11-01"
pages_build_output_dir = ".svelte-kit/cloudflare"

# D1 データベースのバインディング。
# 本番デプロイ前に `wrangler d1 create uma-family-tree` で得た実 ID に置き換える。
# ローカル開発中はこのプレースホルダ ID のままで、ローカル SQLite に対して動作する
# (d1 execute --local と pages dev が同じローカル DB を参照するよう固定値にしている)。
[[d1_databases]]
binding = "DB"
database_name = "uma-family-tree"
database_id = "local-dev-placeholder-0000-0000-000000000000"
