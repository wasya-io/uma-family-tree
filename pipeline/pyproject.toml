[project]
name = "uma-family-tree-pipeline"
version = "0.1.0"
description = "JV-Link 競走馬データを血統 DAG の配信用 JSON に加工するパイプライン"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
uma-pipeline = "uma_pipeline.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
